<!doctype html>
<html lang="en-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FBF7EE">
  <meta name="referrer" content="no-referrer">
  <title>AOL Programs follow-ups</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700&display=swap">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main id="main" class="page">
    <header class="intro">
      <h1 id="title" tabindex="-1">AOL Programs follow-ups</h1>
      <p id="introduction" class="lede"></p>
      <p id="privacy" class="privacy"></p>
    </header>

    <!-- Loading -->
    <section id="loading" class="state state-loading" role="status" aria-live="polite">
      <span class="spinner" aria-hidden="true"></span>
      <span>Loading the survey…</span>
    </section>

    <!-- Load failure -->
    <section id="load-error" class="state state-error" role="alert" hidden>
      <p>The survey could not be loaded. Check your connection and try again.</p>
      <button type="button" id="reload" class="button button-secondary">Try again</button>
    </section>

    <!-- Form (built from GET /api/survey) -->
    <form id="survey" novalidate hidden>
      <div id="form-alert" class="alert" role="alert" tabindex="-1" hidden></div>
      <div id="questions"></div>
      <div class="submit-row">
        <button type="submit" id="submit" class="button button-primary">Share feedback</button>
        <p id="submit-status" class="submit-status" role="status" aria-live="polite"></p>
      </div>
    </form>

    <!-- Saved -->
    <section id="done" class="state state-done" hidden>
      <h2 id="thank-you" tabindex="-1"></h2>
      <p class="next-label">Suggested next step</p>
      <a id="next-step" class="next-step" target="_blank" rel="noopener noreferrer"></a>
      <p class="next-note">Opens the Art of Living page in a new tab. It’s your choice.</p>
    </section>

    <noscript>
      <p class="state state-error">Please turn on JavaScript to share your feedback.</p>
    </noscript>
  </main>
</body>
</html>
